defaults:
  - actor
  - /engine@engine: fsdp
  - /optim@optim: fsdp
  - _self_

_target_: verl.workers.config.ActorConfig
strategy: fsdp2
ppo_mini_batch_size: 32
ppo_micro_batch_size_per_gpu: 1
use_dynamic_bsz: false
ppo_max_token_len_per_gpu: 13312
clip_ratio_low: 0.2
clip_ratio_high: 0.28
policy_loss:
  loss_mode: vanilla
loss_agg_mode: token-mean
entropy_coeff: 0.0
calculate_entropy: false
use_kl_loss: false
use_torch_compile: false
ppo_epochs: 1
engine:
  strategy: fsdp2
  model_dtype: fp32
  mixed_precision:
    # FP32 parameters retain FP32 residuals; GemmaFSDPEngine uses BF16 autocast.
    param_dtype: fp32
    reduce_dtype: fp32
    buffer_dtype: fp32
  ulysses_sequence_parallel_size: 2
  param_offload: false
  optimizer_offload: false
  use_torch_compile: false
  entropy_from_logits_with_chunking: true
  entropy_from_logits_chunk_size: 512
  use_no_sync_for_gradient_accumulation: false
  pad_to_length: true
  pad_to_length_bucket: 256
optim:
  lr: 1.0e-6
  weight_decay: 0.0
  lr_scheduler_type: constant
  min_lr_ratio: 1.0
