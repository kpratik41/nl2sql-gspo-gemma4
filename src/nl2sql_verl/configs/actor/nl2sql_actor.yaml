defaults:
  - actor
  - /engine@engine: automodel
  - /optim@optim: automodel
  - _self_

_target_: verl.workers.config.ActorConfig
strategy: automodel
ppo_mini_batch_size: 4
ppo_micro_batch_size_per_gpu: 1
use_dynamic_bsz: false
ppo_max_token_len_per_gpu: 4096
clip_ratio_low: 0.2
clip_ratio_high: 0.28
policy_loss:
  loss_mode: vanilla
# Match the active TRL token-level IS and DAPO token-mean reduction.
loss_agg_mode: token-mean
entropy_coeff: 0.0
calculate_entropy: false
use_kl_loss: false
use_torch_compile: false
ppo_epochs: 1
engine:
  _target_: src.nl2sql_verl.engine.Gemma4CPEngineConfig
  tp_size: 2
  cp_size: 2
  sequence_parallel: false
  distributed_strategy: fsdp2
  cpu_master_weights: true
  activation_checkpointing: true
  defer_fsdp_grad_sync: false
  model_dtype: bf16
  param_offload: true
  optimizer_offload: true
  attn_implementation: sdpa
  logprob_chunk_size: 128
optim:
  lr: 1.0e-6
  weight_decay: 0.0
  lr_scheduler_type: constant
  init_lr_ratio: 1.0
  min_lr_ratio: 1.0
