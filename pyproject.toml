# This repository publishes three distributions, all built from this one commit:
#
#   packages/synthmark          the shared contract: keys, registry, g-function
#   packages/synthmark-detect   scoring text and the detection service
#   packages/synthmark-eval     HF generation, attacks, metrics, learned detector
#
# There is no root package. Install all three for development with:
#
#   pip install -e packages/synthmark -e packages/synthmark-detect \
#               -e packages/synthmark-eval -e '.[dev]'
#
# keys.py is a compatibility surface, not just code: if derive_key changes,
# every previously watermarked document becomes undetectable. All three
# distributions therefore share one version number and are released together.

[tool.pytest.ini_options]
testpaths = ["tests"]
