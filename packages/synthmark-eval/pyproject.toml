[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthmark-eval"
version = "0.3.0"
description = "HuggingFace watermarked generation, attacks, metrics and the learned detector -- for measuring a watermark, not serving one"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "synthmark==0.3.0",
    "synthmark-detect==0.3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
